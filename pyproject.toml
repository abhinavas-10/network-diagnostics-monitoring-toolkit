[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-diagnostics-toolkit"
version = "1.0.0"
description = "Cross-platform CLI toolkit for network diagnostics and monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netdiag = "network_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["network_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
